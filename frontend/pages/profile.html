<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 词汇量测评</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/index.css">
    <style>
        .profile-card {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            max-width: 480px;
            margin: 3rem auto;
        }
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
        }
        .profile-name {
            text-align: center;
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        .profile-role {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        .profile-role.admin {
            color: var(--red-pen);
            font-weight: 600;
        }
        .profile-info {
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
        }
        .profile-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px dashed var(--border-color);
        }
        .profile-row:last-child {
            border-bottom: none;
        }
        .profile-label {
            color: var(--text-muted);
        }
        .profile-value {
            font-weight: 500;
        }
        .profile-actions {
            margin-top: 1.5rem;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: var(--primary-color);
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-card">
            <div class="profile-avatar" id="profile-avatar">?</div>
            <div class="profile-name" id="profile-name">加载中...</div>
            <div class="profile-role" id="profile-role">...</div>
            
            <div class="profile-info">
                <div class="profile-row">
                    <span class="profile-label">用户名</span>
                    <span class="profile-value" id="profile-username">-</span>
                </div>
                <div class="profile-row">
                    <span class="profile-label">用户 ID</span>
                    <span class="profile-value" id="profile-id">-</span>
                </div>
                <div class="profile-row">
                    <span class="profile-label">注册时间</span>
                    <span class="profile-value" id="profile-created">-</span>
                </div>
            </div>
            
            <div class="profile-actions" id="profile-actions">
                <button class="btn btn-secondary" onclick="handleLogout()">退出登录</button>
                <!-- 管理员按钮由 JS 动态插入 -->
            </div>
            
            <a href="index.html" class="back-link">← 返回首页</a>
        </div>
    </div>
    
    <script src="../js/common.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        (async function() {
            await AUTH.init();
            
            const user = AUTH.getCachedUser();
            
            if (!user) {
                // 未登录，显示提示并跳转
                document.querySelector('.profile-card').innerHTML = `
                    <p class="text-center" style="color: var(--text-muted); padding: 2rem 0;">
                        您当前未登录
                    </p>
                    <div class="profile-actions" style="justify-content: center;">
                        <button class="btn" onclick="AUTH.showLoginModal()">去登录</button>
                        <a href="index.html" class="btn btn-secondary">返回首页</a>
                    </div>
                `;
                return;
            }
            
            // 填充信息
            const avatarEl = document.getElementById('profile-avatar');
            const nameEl = document.getElementById('profile-name');
            const roleEl = document.getElementById('profile-role');
            
            avatarEl.textContent = user.nickname ? user.nickname[0].toUpperCase() : '?';
            nameEl.textContent = user.nickname || user.username;
            roleEl.textContent = user.role === 'admin' 
                ? (user.admin_level === 2 ? '二级管理员' : '一级管理员')
                : '普通用户';
            if (user.role === 'admin') roleEl.classList.add('admin');
            
            document.getElementById('profile-username').textContent = user.username;
            document.getElementById('profile-id').textContent = user.id.substring(0, 8) + '...';
            document.getElementById('profile-created').textContent = user.created_at 
                ? new Date(user.created_at).toLocaleString() 
                : '-';
            
            // 管理员额外按钮
            if (user.role === 'admin') {
                const actions = document.getElementById('profile-actions');
                const adminBtn = document.createElement('button');
                adminBtn.className = 'btn btn-filled';
                adminBtn.textContent = '管理用户';
                adminBtn.onclick = () => window.location.href = 'admin.html';
                actions.insertBefore(adminBtn, actions.firstChild);
            }
        })();
        
        async function handleLogout() {
            if (!confirm('确定要退出登录吗？')) return;
            await AUTH.logout();
            window.location.href = 'index.html';
        }
    </script>
    
    <!-- 登录弹窗（与首页共用） -->
    <div id="auth-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="modal-close" onclick="AUTH.hideLoginModal()">&times;</span>
            <div class="auth-tabs">
                <div class="auth-tab active" data-tab="login" onclick="AUTH.switchAuthTab('login')">登录</div>
                <div class="auth-tab" data-tab="register" onclick="AUTH.switchAuthTab('register')">注册</div>
            </div>
            
            <div id="login-panel" class="auth-panel active">
                <h3 style="margin-bottom: 1rem;">用户登录</h3>
                <input type="text" id="login-username" placeholder="用户名" class="form-input">
                <input type="password" id="login-password" placeholder="密码" class="form-input">
                <button class="btn btn-filled" style="width: 100%; margin-top: 0.5rem;" onclick="doLogin()">登录</button>
                <p id="login-msg" class="form-msg"></p>
            </div>
            
            <div id="register-panel" class="auth-panel">
                <h3 style="margin-bottom: 1rem;">用户注册</h3>
                <input type="text" id="reg-username" placeholder="用户名" class="form-input">
                <input type="text" id="reg-nickname" placeholder="昵称（可选）" class="form-input">
                <input type="password" id="reg-password" placeholder="密码（至少6位）" class="form-input">
                <input type="password" id="reg-password2" placeholder="确认密码" class="form-input">
                <button class="btn btn-filled" style="width: 100%; margin-top: 0.5rem;" onclick="doRegister()">注册</button>
                <p id="reg-msg" class="form-msg"></p>
            </div>
        </div>
    </div>
    
    <script>
        async function doLogin() {
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            const msg = document.getElementById('login-msg');
            
            msg.textContent = '';
            msg.className = 'form-msg';
            
            if (!username || !password) {
                msg.textContent = '请填写用户名和密码';
                msg.className = 'form-msg error';
                return;
            }
            
            const result = await AUTH.login(username, password);
            if (result.ok && result.data.success) {
                msg.textContent = '登录成功！';
                msg.className = 'form-msg success';
                setTimeout(() => window.location.reload(), 600);
            } else {
                msg.textContent = result.data.message || '登录失败';
                msg.className = 'form-msg error';
            }
        }
        
        async function doRegister() {
            const username = document.getElementById('reg-username').value.trim();
            const nickname = document.getElementById('reg-nickname').value.trim();
            const password = document.getElementById('reg-password').value;
            const password2 = document.getElementById('reg-password2').value;
            const msg = document.getElementById('reg-msg');
            
            msg.textContent = '';
            msg.className = 'form-msg';
            
            if (!username || !password) {
                msg.textContent = '用户名和密码不能为空';
                msg.className = 'form-msg error';
                return;
            }
            if (password.length < 6) {
                msg.textContent = '密码长度至少6位';
                msg.className = 'form-msg error';
                return;
            }
            if (password !== password2) {
                msg.textContent = '两次输入的密码不一致';
                msg.className = 'form-msg error';
                return;
            }
            
            const result = await AUTH.register(username, password, nickname || username);
            if (result.ok && result.data.success) {
                msg.textContent = '注册成功！正在登录...';
                msg.className = 'form-msg success';
                // 自动登录
                const loginRes = await AUTH.login(username, password);
                if (loginRes.ok) {
                    setTimeout(() => window.location.reload(), 600);
                }
            } else {
                msg.textContent = result.data.message || '注册失败';
                msg.className = 'form-msg error';
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 词汇量测评</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/index.css">
    <style>
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
        }
        .admin-header h2 {
            margin: 0;
        }
        .user-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .user-table th,
        .user-table td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        .user-table th {
            background: var(--primary-color);
            color: white;
            font-weight: 500;
        }
        .user-table tr:last-child td {
            border-bottom: none;
        }
        .user-table tr:hover {
            background: #f8fafc;
        }
        .role-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        /* 操作按钮 */
        .action-select {
            padding: 4px 8px;
            border: 1.5px solid var(--ink);
            background: var(--paper);
            font-family: var(--font-body);
            font-size: 0.85rem;
            cursor: pointer;
        }
        .action-select:hover {
            border-color: var(--red-pen);
        }
        .action-select:disabled {
            border-color: var(--text-muted);
            color: var(--text-muted);
            cursor: not-allowed;
        }
        .action-btn {
            padding: 4px 12px;
            border: 1.5px solid var(--red-pen);
            background: var(--paper);
            color: var(--red-pen);
            font-family: var(--font-body);
            font-size: 0.8rem;
            cursor: pointer;
            margin-left: 6px;
        }
        .action-btn:hover {
            background: var(--red-pen);
            color: var(--paper);
        }
        .action-btn:disabled {
            border-color: var(--text-muted);
            color: var(--text-muted);
            cursor: not-allowed;
        }
        .role-col {
            min-width: 160px;
        }
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }
        .back-link {
            display: inline-block;
            color: var(--primary-color);
            text-decoration: none;
            margin-bottom: 1rem;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="profile.html" class="back-link">← 返回个人中心</a>
        
        <div class="admin-header">
            <h2>👤 用户管理</h2>
            <span id="admin-count" style="color: var(--text-muted);"></span>
        </div>
        
        <div id="admin-content">
            <p class="empty-tip">加载中...</p>
        </div>
    </div>
    
    <script src="../js/common.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        (async function() {
            await AUTH.init();
            
            const user = AUTH.getCachedUser();
            
            // 权限检查
            if (!user) {
                document.getElementById('admin-content').innerHTML = `
                    <div class="empty-tip">
                        <p>您尚未登录，无权访问此页面</p>
                        <button class="btn" style="margin-top: 1rem;" onclick="AUTH.showLoginModal()">去登录</button>
                    </div>
                `;
                return;
            }
            
            // 兼容旧数据：没有admin_level的admin视为一级
            const myLevel = user.admin_level === undefined ? 1 : user.admin_level;
            
            if (user.role !== 'admin') {
                document.getElementById('admin-content').innerHTML = `
                    <div class="empty-tip">
                        <p>您不是管理员，无权访问此页面</p>
                        <a href="profile.html" class="btn btn-secondary" style="margin-top: 1rem;">返回个人中心</a>
                    </div>
                `;
                return;
            }
            
            // 获取用户列表
            const result = await AUTH.fetchUsers();
            
            if (!result.ok || !result.data.success) {
                document.getElementById('admin-content').innerHTML = `
                    <div class="empty-tip">
                        <p>加载失败：${result.data.message || '未知错误'}</p>
                    </div>
                `;
                return;
            }
            
            const users = result.data.users || [];
            const myLevelText = myLevel === 1 ? '一级管理员' : '二级管理员';
            document.getElementById('admin-count').innerHTML = `共 ${users.length} 位用户 · 当前身份：<span style="color:var(--red-pen)">${myLevelText}</span>`;
            
            if (users.length === 0) {
                document.getElementById('admin-content').innerHTML = `
                    <p class="empty-tip">暂无用户数据</p>
                `;
                return;
            }
            
            // 渲染表格
            const table = document.createElement('table');
            table.className = 'user-table';
            table.innerHTML = `
                <thead>
                    <tr>
                        <th>昵称</th>
                        <th>用户名</th>
                        <th class="role-col">角色</th>
                        <th>注册时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    ${users.map(u => {
                        // 兼容旧数据
                        const level = u.admin_level === undefined ? (u.role === 'admin' ? 1 : null) : u.admin_level;
                        const levelText = level === 1 ? '一级管理员' : (level === 2 ? '二级管理员' : '-');
                        const isAdmin = u.role === 'admin';
                        const isMe = u.id === user.id;
                        return `
                        <tr>
                            <td><strong>${u.nickname || u.username}</strong></td>
                            <td>${u.username}</td>
                            <td>
                                <span class="role-badge ${u.role}">
                                    ${u.role === 'admin' ? (level === 2 ? '二级管理员' : '一级管理员') : '普通用户'}
                                </span>
                            </td>
                            <td>${u.created_at ? new Date(u.created_at).toLocaleString() : '-'}</td>
                            <td>
                                ${myLevel === 1 ? `
                                    ${isMe ? '<span style="color:var(--text-muted)">当前用户</span>' : `
                                        <select class="action-select" id="sel-${u.id}" onchange="onRoleChange('${u.id}')">
                                            <option value="user" ${!isAdmin ? 'selected' : ''}>普通用户</option>
                                            <option value="admin-2" ${isAdmin && level === 2 ? 'selected' : ''}>二级管理员</option>
                                        </select>
                                        <button class="action-btn" id="btn-${u.id}" onclick="applyRole('${u.id}')" disabled>确认</button>
                                    `}
                                ` : (level === 1 ? '<span style="color:var(--red-pen)">一级管理员</span>' : '-')}
                            </td>
                        </tr>
                    `}).join('')}
                </tbody>
            `;
            
            document.getElementById('admin-content').innerHTML = '';
            document.getElementById('admin-content').appendChild(table);
        })();
        
        function onRoleChange(userId) {
            const btn = document.getElementById('btn-' + userId);
            if (btn) btn.disabled = false;
        }
        
        async function applyRole(userId) {
            const sel = document.getElementById('sel-' + userId);
            const btn = document.getElementById('btn-' + userId);
            if (!sel || !btn) return;
            
            btn.disabled = true;
            btn.textContent = '处理中...';
            
            const val = sel.value;
            const newRole = val === 'user' ? 'user' : 'admin';
            const newLevel = val === 'admin-2' ? 2 : null;
            
            const result = await AUTH.updateUserRole(userId, newRole, newLevel);
            
            if (result.ok && result.data.success) {
                btn.textContent = '已更新';
                setTimeout(() => window.location.reload(), 800);
            } else {
                alert(result.data.message || '操作失败');
                btn.textContent = '确认';
                btn.disabled = false;
            }
        }
    </script>
    
    <!-- 登录弹窗 -->
    <div id="auth-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="modal-close" onclick="AUTH.hideLoginModal()">&times;</span>
            <div class="auth-tabs">
                <div class="auth-tab active" data-tab="login" onclick="AUTH.switchAuthTab('login')">登录</div>
                <div class="auth-tab" data-tab="register" onclick="AUTH.switchAuthTab('register')">注册</div>
            </div>
            <div id="login-panel" class="auth-panel active">
                <h3 style="margin-bottom: 1rem;">用户登录</h3>
                <input type="text" id="login-username" placeholder="用户名" class="form-input">
                <input type="password" id="login-password" placeholder="密码" class="form-input">
                <button class="btn btn-filled" style="width: 100%; margin-top: 0.5rem;" onclick="doLogin()">登录</button>
                <p id="login-msg" class="form-msg"></p>
            </div>
            <div id="register-panel" class="auth-panel">
                <h3 style="margin-bottom: 1rem;">用户注册</h3>
                <input type="text" id="reg-username" placeholder="用户名" class="form-input">
                <input type="text" id="reg-nickname" placeholder="昵称（可选）" class="form-input">
                <input type="password" id="reg-password" placeholder="密码（至少6位）" class="form-input">
                <input type="password" id="reg-password2" placeholder="确认密码" class="form-input">
                <button class="btn btn-filled" style="width: 100%; margin-top: 0.5rem;" onclick="doRegister()">注册</button>
                <p id="reg-msg" class="form-msg"></p>
            </div>
        </div>
    </div>
    
    <script>
        async function doLogin() {
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            const msg = document.getElementById('login-msg');
            msg.textContent = '';
            if (!username || !password) { msg.textContent = '请填写用户名和密码'; msg.className = 'form-msg error'; return; }
            const result = await AUTH.login(username, password);
            if (result.ok && result.data.success) {
                msg.textContent = '登录成功！';
                msg.className = 'form-msg success';
                setTimeout(() => window.location.reload(), 600);
            } else {
                msg.textContent = result.data.message || '登录失败';
                msg.className = 'form-msg error';
            }
        }
        async function doRegister() {
            const username = document.getElementById('reg-username').value.trim();
            const nickname = document.getElementById('reg-nickname').value.trim();
            const password = document.getElementById('reg-password').value;
            const password2 = document.getElementById('reg-password2').value;
            const msg = document.getElementById('reg-msg');
            msg.textContent = '';
            if (!username || !password) { msg.textContent = '用户名和密码不能为空'; msg.className = 'form-msg error'; return; }
            if (password.length < 6) { msg.textContent = '密码长度至少6位'; msg.className = 'form-msg error'; return; }
            if (password !== password2) { msg.textContent = '两次输入的密码不一致'; msg.className = 'form-msg error'; return; }
            const result = await AUTH.register(username, password, nickname || username);
            if (result.ok && result.data.success) {
                msg.textContent = '注册成功！正在登录...';
                msg.className = 'form-msg success';
                const loginRes = await AUTH.login(username, password);
                if (loginRes.ok) setTimeout(() => window.location.reload(), 600);
            } else {
                msg.textContent = result.data.message || '注册失败';
                msg.className = 'form-msg error';
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>错题本 - 词汇量测评</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/index.css">
    <style>
        .mistakes-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
        }
        .mistakes-header h2 {
            margin: 0;
        }
        .mistake-count {
            padding: 6px 16px;
            border: 1.5px solid var(--red-pen);
            color: var(--red-pen);
            font-weight: 600;
            font-size: 0.9rem;
        }
        .mistake-card {
            background: white;
            border: var(--border-ink);
            padding: 1rem 1.25rem;
            margin-bottom: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .mistake-word {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--ink);
        }
        .mistake-mean {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }
        .mistake-level {
            display: inline-block;
            padding: 2px 8px;
            font-size: 0.75rem;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            margin-top: 0.25rem;
        }
        .mistake-stats {
            text-align: right;
        }
        .mistake-count-badge {
            display: inline-block;
            padding: 4px 12px;
            background: var(--red-pen);
            color: white;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .mistake-time {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }
        .empty-tip {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }
        .back-link {
            display: inline-block;
            color: var(--primary-color);
            text-decoration: none;
            margin-bottom: 1rem;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="records.html" class="back-link">← 返回测试记录</a>
        
        <div class="mistakes-header">
            <h2>📕 错题本</h2>
            <span id="mistake-count-display" class="mistake-count">加载中...</span>
        </div>
        
        <div id="mistakes-content">
            <p class="empty-tip">加载中...</p>
        </div>
    </div>
    
    <script src="../js/common.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        (async function() {
            await AUTH.init();
            
            const user = AUTH.getCachedUser();
            
            if (!user) {
                document.getElementById('mistakes-content').innerHTML = `
                    <div class="empty-tip">
                        <p>您当前未登录，无法查看错题本</p>
                        <button class="btn" style="margin-top: 1rem;" onclick="AUTH.showLoginModal()">去登录</button>
                        <a href="index.html" class="btn btn-secondary" style="margin-top: 1rem; margin-left: 0.5rem;">返回首页</a>
                    </div>
                `;
                return;
            }
            
            // 加载个人错题本
            const result = await AUTH.fetchPersonalMistakes();
            
            if (!result.ok || !result.data.success) {
                document.getElementById('mistakes-content').innerHTML = `
                    <div class="empty-tip">
                        <p>加载失败：${result.data.message || '未知错误'}</p>
                    </div>
                `;
                return;
            }
            
            const mistakes = result.data.mistakes || [];
            const count = result.data.count || 0;
            
            document.getElementById('mistake-count-display').textContent = `共 ${count} 个错题`;
            
            if (mistakes.length === 0) {
                document.getElementById('mistakes-content').innerHTML = `
                    <div class="empty-tip">
                        <p>暂无错题记录</p>
                        <p style="margin-top: 0.5rem; font-size: 0.9rem;">完成测评并答错单词后，错题将自动收录到这里</p>
                        <a href="index.html" class="btn" style="margin-top: 1rem;">去测评</a>
                    </div>
                `;
                return;
            }
            
            // 渲染错题列表
            const content = document.getElementById('mistakes-content');
            content.innerHTML = '';
            
            mistakes.forEach(m => {
                const card = document.createElement('div');
                card.className = 'mistake-card';
                
                card.innerHTML = `
                    <div>
                        <div class="mistake-word">${m.word}</div>
                        <div class="mistake-mean">${m.mean}</div>
                        ${m.level ? `<span class="mistake-level">${m.level}</span>` : ''}
                    </div>
                    <div class="mistake-stats">
                        <span class="mistake-count-badge">错 ${m.mistakeCount} 次</span>
                        <div class="mistake-time">
                            首次：${m.firstTime ? new Date(m.firstTime).toLocaleDateString() : '-'}<br>
                            最近：${m.lastTime ? new Date(m.lastTime).toLocaleDateString() : '-'}
                        </div>
                    </div>
                `;
                
                content.appendChild(card);
            });
        })();
    </script>
    
    <!-- 登录弹窗 -->
    <div id="auth-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="modal-close" onclick="AUTH.hideLoginModal()">&times;</span>
            <div class="auth-tabs">
                <div class="auth-tab active" data-tab="login" onclick="AUTH.switchAuthTab('login')">登录</div>
                <div class="auth-tab" data-tab="register" onclick="AUTH.switchAuthTab('register')">注册</div>
            </div>
            
            <div id="login-panel" class="auth-panel active">
                <h3 style="margin-bottom: 1rem;">用户登录</h3>
                <input type="text" id="login-username" placeholder="用户名" class="form-input">
                <input type="password" id="login-password" placeholder="密码" class="form-input">
                <button class="btn btn-filled" style="width: 100%; margin-top: 0.5rem;" onclick="doLogin()">登录</button>
                <p id="login-msg" class="form-msg"></p>
            </div>
            
            <div id="register-panel" class="auth-panel">
                <h3 style="margin-bottom: 1rem;">用户注册</h3>
                <input type="text" id="reg-username" placeholder="用户名" class="form-input">
                <input type="text" id="reg-nickname" placeholder="昵称（可选）" class="form-input">
                <input type="password" id="reg-password" placeholder="密码（至少6位）" class="form-input">
                <input type="password" id="reg-password2" placeholder="确认密码" class="form-input">
                <button class="btn btn-filled" style="width: 100%; margin-top: 0.5rem;" onclick="doRegister()">注册</button>
                <p id="reg-msg" class="form-msg"></p>
            </div>
        </div>
    </div>
    
    <script>
        async function doLogin() {
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            const msg = document.getElementById('login-msg');
            msg.textContent = '';
            msg.className = 'form-msg';
            if (!username || !password) {
                msg.textContent = '请填写用户名和密码';
                msg.className = 'form-msg error';
                return;
            }
            const result = await AUTH.login(username, password);
            if (result.ok && result.data.success) {
                msg.textContent = '登录成功！';
                msg.className = 'form-msg success';
                setTimeout(() => window.location.reload(), 600);
            } else {
                msg.textContent = result.data.message || '登录失败';
                msg.className = 'form-msg error';
            }
        }
        
        async function doRegister() {
            const username = document.getElementById('reg-username').value.trim();
            const nickname = document.getElementById('reg-nickname').value.trim();
            const password = document.getElementById('reg-password').value;
            const password2 = document.getElementById('reg-password2').value;
            const msg = document.getElementById('reg-msg');
            msg.textContent = '';
            msg.className = 'form-msg';
            if (!username || !password) {
                msg.textContent = '用户名和密码不能为空';
                msg.className = 'form-msg error';
                return;
            }
            if (password.length < 6) {
                msg.textContent = '密码长度至少6位';
                msg.className = 'form-msg error';
                return;
            }
            if (password !== password2) {
                msg.textContent = '两次输入的密码不一致';
                msg.className = 'form-msg error';
                return;
            }
            const result = await AUTH.register(username, password, nickname || username);
            if (result.ok && result.data.success) {
                msg.textContent = '注册成功！正在登录...';
                msg.className = 'form-msg success';
                const loginRes = await AUTH.login(username, password);
                if (loginRes.ok) {
                    setTimeout(() => window.location.reload(), 600);
                }
            } else {
                msg.textContent = result.data.message || '注册失败';
                msg.className = 'form-msg error';
            }
        }
    </script>
</body>
</html>
